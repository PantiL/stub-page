<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 15px; }
        p { color: #666; line-height: 1.6; margin-bottom: 25px; }
        .badge { display: inline-block; background: #ffeaa7; color: #d63031; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Временные неполадки</div>
        <h1>Ведутся технические работы</h1>
        <p>Наш хостинг-провайдер столкнулся с масштабным сбоем. В данный момент мы разворачиваем резервные копии и восстанавливаем работу сервиса. Скоро мы вернемся!</p>
        <p style="font-size: 14px; color: #999;">Приносим извинения за временные неудобства.</p>
    </div>
</body>
</html>
